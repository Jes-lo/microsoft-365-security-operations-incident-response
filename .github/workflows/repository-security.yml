name: Repository Security

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repository-validation:
    name: Repository validation
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      - name: Validate shell syntax
        shell: bash
        run: |
          bash -n scripts/validate-repository.sh
          bash -n tests/test-repository-validation.sh
          bash -n scripts/validate-security-signal-capabilities.sh
          bash -n tests/test-security-signal-capabilities.sh
          pwsh -NoLogo -NoProfile -Command '$null = [scriptblock]::Create((Get-Content -Raw "automation/powershell/Invoke-SecuritySignalCapabilityDiscovery.ps1"))'

      - name: Run repository security validation
        shell: bash
        run: ./scripts/validate-repository.sh

      - name: Run adversarial validation tests
        shell: bash
        run: |
          ./tests/test-repository-validation.sh
          ./tests/test-security-signal-capabilities.sh
